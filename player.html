<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d4a017">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>D_a_N Mixtape Player</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="player.css">
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">D_a_N</div>
    <div class="header-title">MIXTAPE PLAYER</div>
    <button class="header-load-btn" onclick="rpOpenPicker('folder')">📂</button>
  </div>

  <!-- EMPTY STATE -->
  <div class="empty-state" id="rpEmpty">
    <div class="drop-zone" id="rpDrop" onclick="rpOpenPicker('folder')">
      <div class="drop-vinyl">◉</div>
      <div class="drop-title">TRACKS LADEN</div>
      <div class="drop-sub">Ordner oder Dateien auswählen</div>
    </div>
    <button class="btn-load-files" onclick="rpOpenPicker('files')">🎵 EINZELNE DATEIEN</button>
    <div class="drop-formats">MP3 · WAV · FLAC · AAC · OGG · MP4 · MKV u.v.m.</div>
  </div>

  <!-- PLAYER -->
  <div class="player-wrap" id="rpPlayer" style="display:none">

    <!-- VIDEO -->
    <div class="video-wrap" id="rpVideoWrap">
      <video id="rpVideo" playsinline></video>
    </div>

    <!-- VINYL -->
    <div class="vinyl-section">
      <div class="vinyl-outer">
        <div class="vinyl-disc" id="rpVinyl">
          <div class="vinyl-groove g1"></div>
          <div class="vinyl-groove g2"></div>
          <div class="vinyl-groove g3"></div>
          <div class="vinyl-label">
            <div class="vinyl-label-name">D_a_N</div>
            <div class="vinyl-label-dot">●</div>
          </div>
        </div>
      </div>
    </div>

    <!-- TRACK INFO -->
    <div class="track-info-section">
      <div class="track-marquee-wrap">
        <div class="track-marquee" id="rpTrackName">– – –</div>
      </div>
      <div class="track-sub" id="rpTrackSub">TRACK 0 / 0</div>
    </div>

    <!-- EQUALIZER VISUALIZER -->
    <div class="eq-section" id="rpEq">
      <div class="eq-bar" id="eq0"></div>
      <div class="eq-bar" id="eq1"></div>
      <div class="eq-bar" id="eq2"></div>
      <div class="eq-bar" id="eq3"></div>
      <div class="eq-bar" id="eq4"></div>
      <div class="eq-bar" id="eq5"></div>
      <div class="eq-bar" id="eq6"></div>
      <div class="eq-bar" id="eq7"></div>
      <div class="eq-bar" id="eq8"></div>
      <div class="eq-bar" id="eq9"></div>
      <div class="eq-bar" id="eq10"></div>
      <div class="eq-bar" id="eq11"></div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-section">
      <span class="p-time" id="rpCur">0:00</span>
      <input type="range" class="p-bar" id="rpBar" min="0" max="100" value="0" step="0.1" oninput="rpSeek(this.value)">
      <span class="p-time" id="rpTot">0:00</span>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="ctrl-btn" id="rpShuffleBtn" onclick="rpToggleShuffle()">🔀</button>
      <button class="ctrl-btn" onclick="rpPrev()">⏮</button>
      <button class="ctrl-btn play-btn" id="rpPlayBtn" onclick="rpTogglePlay()">▶</button>
      <button class="ctrl-btn" onclick="rpNext()">⏭</button>
      <button class="ctrl-btn" id="rpRepeatBtn" onclick="rpToggleRepeat()">🔁</button>
    </div>

    <!-- VOLUME -->
    <div class="vol-section">
      <span class="vol-icon">🔈</span>
      <input type="range" class="vol-bar" id="rpVol" min="0" max="1" step="0.01" value="1" oninput="rpSetVol(this.value)">
      <span class="vol-icon">🔊</span>
    </div>

    <!-- PLAYLIST HEADER -->
    <div class="pl-header">
      <span class="pl-title">TRACKLIST</span>
      <span class="pl-count" id="rpCount">0 TRACKS</span>
      <div class="pl-actions">
        <button class="pl-btn" onclick="rpOpenPicker('files')">+ ADD</button>
        <button class="pl-btn danger" onclick="rpClear()">✕</button>
      </div>
    </div>

    <!-- PLAYLIST -->
    <div class="playlist" id="rpList"></div>

  </div>
</div>

<!-- HIDDEN INPUTS -->
<input type="file" id="rpFolderIn" webkitdirectory multiple style="display:none" onchange="rpLoad(event)">
<input type="file" id="rpFilesIn" multiple accept="audio/*,video/*,.mp3,.wav,.ogg,.flac,.aac,.m4a,.opus,.mp4,.webm,.mov,.mkv,.avi,.m4v,.wma" style="display:none" onchange="rpLoad(event)">

<script src="player.js"></script>
</body>
</html>
