<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1810"/>
      <stop offset="100%" stop-color="#0d0b08"/>
    </linearGradient>
    <linearGradient id="goldM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5cc50"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8a6010"/>
    </linearGradient>
    <radialGradient id="vinylM" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#2a2520"/>
      <stop offset="18%" stop-color="#111"/>
      <stop offset="19%" stop-color="#1c1c1c"/>
      <stop offset="34%" stop-color="#0d0d0d"/>
      <stop offset="35%" stop-color="#1c1c1c"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="51%" stop-color="#1c1c1c"/>
      <stop offset="66%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
  </defs>

  <!-- Full bleed background (maskable: kein Radius) -->
  <rect width="512" height="512" fill="url(#bgM)"/>

  <!-- Vinyl disc (etwas kleiner wegen Safe Zone) -->
  <circle cx="256" cy="250" r="158" fill="url(#vinylM)"/>

  <!-- Groove rings -->
  <circle cx="256" cy="250" r="144" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="256" cy="250" r="124" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="256" cy="250" r="104" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="256" cy="250" r="84"  fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Center label -->
  <circle cx="256" cy="250" r="54" fill="url(#goldM)"/>
  <ellipse cx="244" cy="235" rx="26" ry="14" fill="rgba(255,255,255,0.12)" transform="rotate(-20,244,235)"/>
  <circle cx="256" cy="250" r="6" fill="#0d0b08"/>

  <!-- DaN on label -->
  <text x="256" y="244"
        text-anchor="middle"
        font-family="Impact,'Arial Narrow',Arial,sans-serif"
        font-size="24" font-weight="900"
        fill="#0d0b08" letter-spacing="3">DaN</text>
  <text x="256" y="263"
        text-anchor="middle"
        font-family="'Arial Narrow',Arial,sans-serif"
        font-size="10" font-weight="700"
        fill="#3a2a08" letter-spacing="5">VIBE</text>
</svg>
